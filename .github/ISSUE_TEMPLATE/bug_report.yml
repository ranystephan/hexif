name: Bug report
description: Report a bug in HEXIF
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in as much detail as possible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal steps or code snippet to reproduce the issue.
      placeholder: |
        ```python
        hexif serve-workbench --bundle /path/to/authorized_bundle
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include full error traceback if applicable.
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command or component
      description: Which CLI command, Python module, or Workbench page failed?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Output of:
        ```bash
        python -c "import hexif, torch, platform; print(hexif.__version__, torch.__version__, torch.cuda.is_available(), platform.platform())"
        ```
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help us diagnose.
    validations:
      required: false
