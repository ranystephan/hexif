[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hexif"
version = "0.1.0.dev0"
description = "Cell-level virtual spatial cytometry from H&E."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Rany Stephan", email = "ranyc@stanford.edu" },
]
maintainers = [
    { name = "Rany Stephan", email = "ranyc@stanford.edu" },
]
keywords = [
    "computational-pathology",
    "cell-phenotyping",
    "spatial-cytometry",
    "multiplex-imaging",
    "immunofluorescence",
    "deep-learning",
    "histology",
    "CODEX",
    "H&E",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "scikit-image>=0.22",
    "timm>=1.0",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
train = [
    "torchvision>=0.16",
    "omegaconf>=2.3",
    "scikit-learn>=1.3",
]
preprocess = [
    "valis-wsi>=1.0",
    "opencv-python>=4.9",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
]
audit = [
    "spacec>=1.0",
    "anndata>=0.10",
    "scanpy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pyarrow>=14.0",
    "jinja2>=3.1",
    "weasyprint>=60",
    "plotly>=5.20",
    "matplotlib>=3.7",
    "anndata>=0.10",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "pyvips>=2.2",
    "markdown-it-py>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "build>=1.0",
    "twine>=5.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
full = [
    "hexif[train,preprocess,audit,web,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ranystephan/hexif"
Repository = "https://github.com/ranystephan/hexif"
"Lab Page" = "https://ajglab.org/"

[project.scripts]
hexif = "hexif.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hexif", "webapp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hexif",
    "webapp",
    "docs",
    "README.md",
    "DEVELOPMENT.md",
    "LICENSE",
    "CITATION.cff",
    "pyproject.toml",
]
exclude = [
    ".gitignore",
    "experiments",
    "notebooks",
    "benchmarks",
    "paper",
    "presentations",
    "archive",
    "tests/data/large",
    "*.pdf",
    "*.tif",
    "*.tiff",
    "*.npy",
    "*.tar.gz",
]

# ---------- Tooling ----------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["webapp/static/workbench/vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    # The unicode `×` multiplication sign is intentionally used in
    # docstrings/comments (e.g. "224×224 patch"); flagging it as
    # ambiguous is just noise here.
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    # `step += 1` inside a `for batch in loader:` is the idiomatic way
    # to count training steps; converting to `enumerate(loader)` would
    # add a noisy second loop variable for no win.
    "SIM113", # enumerate-for-loop
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"experiments/**" = ["E501", "E402", "E702", "E701"]
"scripts/**" = ["E402", "E702", "E701"]
"webapp/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = [
    "experiments.*",
    "notebooks/.*",
    "paper/.*",
    "archive/.*",
    "build/",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: tests requiring an explicitly configured real-data bundle; they skip when it is absent.",
]
